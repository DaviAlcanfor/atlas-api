  Q5684712: {label: puri, regions: [América do Sul]}
  Q716831: {label: arutani-sapé, regions: [América do Sul]}
  Q12634451: {label: quíchua, regions: [América do Sul]}
  Q33010: {label: aimará, regions: [América do Sul]}
