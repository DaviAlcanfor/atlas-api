# spec 017. Wikidata Q-id of a language family -> our pt-BR label + regions where it is NATIVE.
# Used by `python -m etl wikidata-languages`:
# - `family` of a language = label of the FIRST entry below that is a P279+ ancestor of it;
#   entries without `label` only classify (sub-families placed under a broad label).
# - status "indigenous" when a matching entry lists the country's region (country_facts.region).
# - `foreign_in`: regions where the family arrived by colonisation/migration; there its languages are never "indigenous",
#   even with Wikidata P2341 (Hunsrik and Talian took shape in Brazil but are immigrant languages).
#   Broad families that spread by migration/colonisation (indo-europeia, afro-asiática, turcomana,
#   dravídica, sino-tibetana...) have NO regions on purpose: otherwise French in Germany or
#   Tamil in Malaysia would be "indigenous". Their languages are indigenous only via P2341.
# Q-ids were taken from the Wikidata data itself (etl_cache), not typed from memory.
# RASCUNHO do agente: revisão humana pendente.
families:
  # Americas
  Q34070: {label: tupi, regions: [América do Sul]}
  Q887133: {label: macro-jê, regions: [América do Sul]}
  Q626753: {label: aruaque, regions: [América do Sul, América do Norte]}
  Q2475746: {label: pano-tacana, regions: [América do Sul]}
  Q788144: {label: tucano, regions: [América do Sul]}
