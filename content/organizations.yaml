# Spec 032 (extends 026): curated memberships WITH join/leave dates. Wikidata P463 is complete only for the UN and its
# dates are patchy (see specs/032-organizations.md, cross-check). Written to the DB by `import-content`.
# Key = id of a glossary term of kind `membership` (its label is what CountryDetail.memberships shows).
# One row per membership period: a country that left and rejoined has two rows. Dates are ISO 8601 strings with the
# source's precision ("YYYY", "YYYY-MM" or "YYYY-MM-DD"); `left` absent = still a member; `suspended: true` = member
# with rights suspended (still a member). Every membership cites its organization's `source` (Wikipedia revision
# permalink, CC BY-SA 4.0: facts only, no text copied). ISO2 codes are quoted strings (NO is a YAML boolean).
# Built by hand from the cited revisions on 2026-11-17. AGENT DRAFT, pending human review like glossary.yaml.

