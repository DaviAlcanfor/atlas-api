# RASCUNHO — revisão humana pendente.
# Verbetes do glossário (spec 004), texto próprio (não copiado), escrito por agente em 2026-11-11.
# As fontes são para conferência; os títulos dos artigos foram verificados na API da Wikipédia em 2026-11-11.
# Campos: id, kind (regime|system|region|membership|currency|other), label, short (1 frase), body,
# icon (null), sources [{id, title, url, license, retrieved_at}]. `examples` é calculado pela API.
# Todo regime_id de content/regimes.yaml precisa de um verbete kind: regime com o mesmo id.

terms:
  # --- regimes ------------------------------------------------------------------------------
  - id: republica-presidencialista
    kind: regime
    label: República presidencialista
    short: O presidente, eleito pelo povo, é ao mesmo tempo chefe de Estado e chefe de governo.
    body: >-
      O presidente comanda o governo e representa o país. Ele tem mandato fixo e, em regra, não
      pode ser derrubado pelo parlamento por simples falta de apoio político, só por processos
      especiais como o impeachment. Executivo e Legislativo são eleitos separadamente e um
      fiscaliza o outro.
    icon: null
    sources:
      - {id: wp-pt-presidencialismo, title: "Presidencialismo (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Presidencialismo", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
      - {id: wp-en-presidential-system, title: "Presidential system (Wikipedia)", url: "https://en.wikipedia.org/wiki/Presidential_system", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: republica-semipresidencialista
    kind: regime
    label: República semipresidencialista
    short: Um presidente eleito divide o poder executivo com um primeiro-ministro que depende do parlamento.
    body: >-
      O presidente é eleito pelo povo e tem poderes próprios (por exemplo, em política externa ou
      defesa). O dia a dia do governo fica com um primeiro-ministro, que precisa da confiança do
      parlamento e pode ser destituído por ele. O equilíbrio entre os dois muda de país para país.
    icon: null
    sources:
      - {id: wp-pt-semipresidencialismo, title: "Semipresidencialismo (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Semipresidencialismo", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
      - {id: wp-en-semi-presidential-system, title: "Semi-presidential system (Wikipedia)", url: "https://en.wikipedia.org/wiki/Semi-presidential_system", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: republica-parlamentarista
    kind: regime
    label: República parlamentarista
    short: O governo é chefiado por um primeiro-ministro escolhido pelo parlamento; o presidente tem papel sobretudo cerimonial.
    body: >-
      Os eleitores escolhem o parlamento, e o governo sai da maioria parlamentar. O primeiro-ministro
      (ou chanceler) governa enquanto tiver essa maioria; se a perder, pode cair por um voto de
      desconfiança. O presidente é o chefe de Estado, com funções em geral representativas.
    icon: null
    sources:
      - {id: wp-pt-republica-parlamentarista, title: "República parlamentarista (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Rep%C3%BAblica_parlamentarista", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
      - {id: wp-en-parliamentary-republic, title: "Parliamentary republic (Wikipedia)", url: "https://en.wikipedia.org/wiki/Parliamentary_republic", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: republica
    kind: regime
    label: República
    short: O chefe de Estado não é um monarca hereditário; a fonte não diz se o sistema é presidencialista ou parlamentarista.
    body: >-
      Numa república, o chefe de Estado é escolhido (por eleição direta, indireta ou outro meio) e
      não herda o cargo. Aqui o rótulo é genérico porque o Wikidata só informa "república" para este
      país, sem dizer como o governo se organiza; os detalhes ficam para a revisão.
    icon: null
    sources:
      - {id: wp-pt-republica, title: "República (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Rep%C3%BAblica", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
      - {id: wp-en-republic, title: "Republic (Wikipedia)", url: "https://en.wikipedia.org/wiki/Republic", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: republica-popular
    kind: regime
    label: República popular
    short: Nome adotado sobretudo por Estados que se declaram socialistas, em geral com um partido dominante.
    body: >-
      "República popular" é um termo usado na denominação oficial de vários Estados, principalmente
      os que se apresentam como socialistas. Na prática, costuma indicar um sistema em que um partido
      comunista ou de vanguarda dirige o Estado, mas o nome sozinho não descreve as instituições.
    icon: null
    sources:
      - {id: wp-pt-republica-popular, title: "República popular (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Rep%C3%BAblica_popular", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
      - {id: wp-en-peoples-republic, title: "People's republic (Wikipedia)", url: "https://en.wikipedia.org/wiki/People%27s_republic", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: republica-islamica
    kind: regime
    label: República islâmica
    short: República cuja constituição coloca a lei islâmica como base do Estado.
    body: >-
      Tem instituições republicanas, como presidente e parlamento eleitos, mas a constituição dá à
      lei islâmica um papel central. Em alguns casos, autoridades religiosas têm poder de vetar
      leis ou candidatos e ficam acima dos cargos eleitos.
    icon: null
    sources:
      - {id: wp-pt-republica-islamica, title: "República islâmica (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Rep%C3%BAblica_isl%C3%A2mica", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
      - {id: wp-en-islamic-republic, title: "Islamic republic (Wikipedia)", url: "https://en.wikipedia.org/wiki/Islamic_republic", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: monarquia-constitucional
    kind: regime
    label: Monarquia constitucional
    short: Há um monarca como chefe de Estado, mas seus poderes são limitados por uma constituição.
    body: >-
      O rei, rainha, emir ou príncipe ocupa o cargo de chefe de Estado, normalmente por herança. Uma
      constituição limita o que ele pode fazer. Em muitos casos o papel é cerimonial e quem governa é
      um primeiro-ministro apoiado pelo parlamento; em outros, o monarca mantém poderes importantes.
    icon: null
    sources:
      - {id: wp-pt-monarquia-constitucional, title: "Monarquia constitucional (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Monarquia_constitucional", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
      - {id: wp-en-constitutional-monarchy, title: "Constitutional monarchy (Wikipedia)", url: "https://en.wikipedia.org/wiki/Constitutional_monarchy", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: monarquia-absoluta
    kind: regime
    label: Monarquia absoluta
    short: O monarca concentra o poder de governar, sem limites efetivos de uma constituição ou parlamento.
    body: >-
      O monarca é ao mesmo tempo chefe de Estado e de governo e decide as leis e as nomeações
      principais. Pode haver conselhos ou assembleias, mas eles são consultivos ou dependem da
      vontade do monarca.
    icon: null
    sources:
      - {id: wp-pt-monarquia-absoluta, title: "Monarquia absoluta (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Monarquia_absoluta", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
      - {id: wp-en-absolute-monarchy, title: "Absolute monarchy (Wikipedia)", url: "https://en.wikipedia.org/wiki/Absolute_monarchy", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: teocracia
    kind: regime
    label: Teocracia
    short: O poder político é exercido por autoridades religiosas ou em nome de uma religião.
    body: >-
      Numa teocracia, a autoridade do governo é justificada pela religião, e líderes religiosos
      ocupam os cargos mais altos ou têm a palavra final. As leis seguem, total ou parcialmente,
      normas religiosas.
    icon: null
    sources:
      - {id: wp-pt-teocracia, title: "Teocracia (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Teocracia", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
      - {id: wp-en-theocracy, title: "Theocracy (Wikipedia)", url: "https://en.wikipedia.org/wiki/Theocracy", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: estado-de-partido-unico
    kind: regime
    label: Estado de partido único
    short: Um só partido tem o direito legal de governar; outros partidos são proibidos ou sem poder real.
    body: >-
      A constituição ou a prática política garante a um único partido o controle do Estado. Pode
      haver eleições, mas sem disputa real pelo poder entre partidos. Os cargos mais altos do
      governo costumam ser ocupados pela direção do partido.
    icon: null
    sources:
      - {id: wp-pt-unipartidarismo, title: "Unipartidarismo (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Unipartidarismo", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
      - {id: wp-en-one-party-state, title: "One-party state (Wikipedia)", url: "https://en.wikipedia.org/wiki/One-party_state", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: junta-militar
    kind: regime
    label: Junta militar
    short: Um grupo de chefes militares governa o país, em geral depois de tomar o poder.
    body: >-
      O governo fica com oficiais das Forças Armadas, muitas vezes após um golpe de Estado. As
      instituições civis e a constituição podem ser suspensas, e os militares costumam se apresentar
      como governo de transição.
    icon: null
    sources:
      - {id: wp-pt-junta-militar, title: "Junta militar (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Junta_militar", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
      - {id: wp-en-military-junta, title: "Military junta (Wikipedia)", url: "https://en.wikipedia.org/wiki/Military_junta", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: sistema-diretorial
    kind: regime
    label: Sistema diretorial
    short: O poder executivo é exercido por um conselho de várias pessoas, e não por um só chefe.
    body: >-
      Em vez de um presidente ou primeiro-ministro, um colegiado eleito pelo parlamento governa em
      conjunto, e as decisões são tomadas pelo grupo. A presidência do conselho é sobretudo
      representativa e costuma passar de um membro para outro.
    icon: null
    sources:
      - {id: wp-pt-sistema-diretorial, title: "Sistema diretorial (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Sistema_diretorial", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
      - {id: wp-en-directorial-system, title: "Directorial system (Wikipedia)", url: "https://en.wikipedia.org/wiki/Directorial_system", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: governo-provisorio
    kind: regime
    label: Governo provisório
    short: Governo temporário que administra o país durante uma transição, até que novas instituições sejam definidas.
    body: >-
      Costuma surgir depois de uma revolução, guerra ou queda de um regime. Tem a tarefa declarada de
      conduzir o país até uma nova constituição ou eleições, e suas regras podem mudar com rapidez.
    icon: null
    sources:
      - {id: wp-pt-governo-provisorio, title: "Governo provisório (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Governo_provis%C3%B3rio", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
      - {id: wp-en-provisional-government, title: "Provisional government (Wikipedia)", url: "https://en.wikipedia.org/wiki/Provisional_government", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  # --- regiões (valores de `region`; países transcontinentais aparecem como "Europa / Ásia") ----
  - id: africa
    kind: region
    label: África
    short: Continente ao sul da Europa, entre os oceanos Atlântico e Índico.
    body: >-
      Segundo continente mais populoso do mundo, ligado à Ásia pelo istmo de Suez. É o continente com
      mais países soberanos. Aqui a região de cada país vem do Wikidata (propriedade "continente").
    icon: null
    sources:
      - {id: wp-pt-africa, title: "África (Wikipédia)", url: "https://pt.wikipedia.org/wiki/%C3%81frica", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: america-do-norte
    kind: region
    label: América do Norte
    short: Continente do hemisfério norte que, nesta classificação, inclui a América Central e o Caribe.
    body: >-
      Vai do Canadá e da Groenlândia até o Panamá. Na classificação usada pelo Wikidata, os países da
      América Central e das ilhas do Caribe também contam como América do Norte.
    icon: null
    sources:
      - {id: wp-pt-america-do-norte, title: "América do Norte (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Am%C3%A9rica_do_Norte", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: america-do-sul
    kind: region
    label: América do Sul
    short: Continente do hemisfério sul (em sua maior parte) que vai da Colômbia e Venezuela até a Terra do Fogo.
    body: >-
      Reúne doze países soberanos. Liga-se à América do Norte pelo istmo do Panamá e abriga a maior
      parte da floresta amazônica e a cordilheira dos Andes.
    icon: null
    sources:
      - {id: wp-pt-america-do-sul, title: "América do Sul (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Am%C3%A9rica_do_Sul", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: asia
    kind: region
    label: Ásia
    short: Maior e mais populoso continente, a leste da Europa e ao norte do oceano Índico.
    body: >-
      Vai do Oriente Médio ao Japão e da Sibéria à Indonésia. Concentra a maior parte da população
      mundial. Alguns países ficam entre a Ásia e a Europa e aparecem com as duas regiões.
    icon: null
    sources:
      - {id: wp-pt-asia, title: "Ásia (Wikipédia)", url: "https://pt.wikipedia.org/wiki/%C3%81sia", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: europa
    kind: region
    label: Europa
    short: Continente a oeste da Ásia, com a qual forma uma única massa de terra (a Eurásia).
    body: >-
      O limite com a Ásia é uma convenção (montes Urais, rio Ural, Cáucaso e estreitos turcos), por
      isso países como Rússia e Turquia podem ser classificados nos dois continentes.
    icon: null
    sources:
      - {id: wp-pt-europa, title: "Europa (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Europa", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: eurasia
    kind: region
    label: Eurásia
    short: Massa de terra formada pela Europa e pela Ásia juntas.
    body: >-
      Alguns registros do Wikidata usam "Eurásia" como continente de países que se estendem pelos dois
      lados do limite convencional entre Europa e Ásia.
    icon: null
    sources:
      - {id: wp-pt-eurasia, title: "Eurásia (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Eur%C3%A1sia", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  - id: oceania
    kind: region
    label: Oceania
    short: Região formada pela Austrália, Nova Zelândia e pelas ilhas do Pacífico.
    body: >-
      Inclui a Austrália, a Nova Zelândia, a Papua-Nova Guiné e os arquipélagos da Melanésia,
      Micronésia e Polinésia. Muitos de seus países são pequenos Estados insulares.
    icon: null
    sources:
      - {id: wp-pt-oceania, title: "Oceânia (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Oce%C3%A2nia", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}

  # --- organizações (valores de `memberships`) ------------------------------------------------
  - id: onu
    kind: membership
    label: ONU
    short: Organização das Nações Unidas, que reúne quase todos os países soberanos do mundo.
    body: >-
      Criada em 1945, depois da Segunda Guerra Mundial, para manter a paz e a cooperação entre os
      países. Tem 193 Estados-membros; cada um tem um voto na Assembleia Geral.
    icon: null
    sources:
      - {id: wp-pt-onu, title: "Organização das Nações Unidas (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Organiza%C3%A7%C3%A3o_das_Na%C3%A7%C3%B5es_Unidas", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
      - {id: wp-en-united-nations, title: "United Nations (Wikipedia)", url: "https://en.wikipedia.org/wiki/United_Nations", license: "CC BY-SA 4.0", retrieved_at: "2026-11-11T00:00:00Z"}
  - id: mercosul
    kind: membership
    label: Mercosul
    short: "Mercado Comum do Sul: bloco econômico da América do Sul."
    body: >-
      Criado em 1991 pelo Tratado de Assunção. Os membros têm livre comércio entre si e uma tarifa externa comum para a maior parte dos produtos. Membros plenos: Argentina, Brasil, Paraguai, Uruguai e Bolívia (desde 2024); a Venezuela está suspensa desde 2016.
    icon: null
    sources:
      - {id: wp-pt-mercosul, title: "Mercosul (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Mercosul", license: "CC BY-SA 4.0", retrieved_at: "2026-11-13T00:00:00Z"}
  - id: brics
    kind: membership
    label: BRICS
    short: "Grupo de grandes economias emergentes que coordena posições políticas e econômicas."
    body: >-
      Começou em 2009 com Brasil, Rússia, Índia e China; a África do Sul entrou em 2011. Em 2024 e 2025 entraram Egito, Etiópia, Irã, Emirados Árabes Unidos e Indonésia. Não é um bloco de livre comércio: é um fórum de cúpulas, com um banco próprio (Novo Banco de Desenvolvimento).
    icon: null
    sources:
      - {id: wp-pt-brics, title: "BRICS (Wikipédia)", url: "https://pt.wikipedia.org/wiki/BRICS", license: "CC BY-SA 4.0", retrieved_at: "2026-11-13T00:00:00Z"}
  - id: g7
    kind: membership
    label: G7
    short: "Grupo das sete grandes economias industrializadas e democráticas."
    body: >-
      Canadá, França, Alemanha, Itália, Japão, Reino Unido e Estados Unidos se reúnem todo ano para coordenar economia, segurança e outros temas. A União Europeia também participa das cúpulas. A Rússia fez parte (G8) de 1997 a 2014.
    icon: null
    sources:
      - {id: wp-pt-g7, title: "G7 (Wikipédia)", url: "https://pt.wikipedia.org/wiki/G7", license: "CC BY-SA 4.0", retrieved_at: "2026-11-13T00:00:00Z"}
  - id: g20
    kind: membership
    label: G20
    short: "Fórum das 19 maiores economias do mundo, mais a União Europeia e a União Africana."
    body: >-
      Criado em 1999 e elevado a cúpula de chefes de Estado na crise de 2008. Os membros somam cerca de 85% do PIB mundial e dois terços da população. Discute economia global, finanças, clima e desenvolvimento; as decisões não são obrigatórias.
    icon: null
    sources:
      - {id: wp-pt-g20, title: "G20 (Wikipédia)", url: "https://pt.wikipedia.org/wiki/G20", license: "CC BY-SA 4.0", retrieved_at: "2026-11-13T00:00:00Z"}
  - id: uniao-europeia
    kind: membership
    label: União Europeia
    short: "União política e econômica de 27 países europeus."
    body: >-
      Tem mercado único (livre circulação de bens, serviços, capitais e pessoas), instituições comuns (Parlamento Europeu, Comissão, Conselho, Tribunal de Justiça) e leis que valem em todos os membros. 20 dos 27 usam o euro. O Reino Unido saiu em 2020.
    icon: null
    sources:
      - {id: wp-pt-uniao-europeia, title: "União Europeia (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Uni%C3%A3o_Europeia", license: "CC BY-SA 4.0", retrieved_at: "2026-11-13T00:00:00Z"}
  - id: otan
    kind: membership
    label: OTAN
    short: "Organização do Tratado do Atlântico Norte: aliança militar de defesa mútua."
    body: >-
      Criada em 1949. Pelo artigo 5 do tratado, um ataque armado contra um membro é considerado um ataque contra todos. Tem 32 membros na Europa e na América do Norte; Finlândia (2023) e Suécia (2024) foram os últimos a entrar.
    icon: null
    sources:
      - {id: wp-pt-otan, title: "Organização do Tratado do Atlântico Norte (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Organiza%C3%A7%C3%A3o_do_Tratado_do_Atl%C3%A2ntico_Norte", license: "CC BY-SA 4.0", retrieved_at: "2026-11-13T00:00:00Z"}
  - id: opep
    kind: membership
    label: OPEP
    short: "Organização dos Países Exportadores de Petróleo."
    body: >-
      Criada em 1960 para coordenar a política de petróleo dos membros, inclusive cotas de produção que influenciam o preço mundial. Desde 2016 atua junto com outros produtores, como a Rússia, no grupo chamado OPEP+.
    icon: null
    sources:
      - {id: wp-pt-opep, title: "Organização dos Países Exportadores de Petróleo (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Organiza%C3%A7%C3%A3o_dos_Pa%C3%ADses_Exportadores_de_Petr%C3%B3leo", license: "CC BY-SA 4.0", retrieved_at: "2026-11-13T00:00:00Z"}
  - id: asean
    kind: membership
    label: ASEAN
    short: "Associação de Nações do Sudeste Asiático."
    body: >-
      Criada em 1967. Promove cooperação econômica, política e de segurança entre os membros, com uma área de livre comércio desde 1992. Timor-Leste foi o 11º membro, em 2025.
    icon: null
    sources:
      - {id: wp-pt-asean, title: "Associação de Nações do Sudeste Asiático (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Associa%C3%A7%C3%A3o_de_Na%C3%A7%C3%B5es_do_Sudeste_Asi%C3%A1tico", license: "CC BY-SA 4.0", retrieved_at: "2026-11-13T00:00:00Z"}
  - id: uniao-africana
    kind: membership
    label: União Africana
    short: "Organização que reúne os 55 Estados da África."
    body: >-
      Sucedeu a Organização da Unidade Africana em 2002. Trata de paz e segurança, integração econômica (como a Zona de Livre Comércio Continental) e governança; pode suspender membros depois de golpes de Estado.
    icon: null
    sources:
      - {id: wp-pt-uniao-africana, title: "União Africana (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Uni%C3%A3o_Africana", license: "CC BY-SA 4.0", retrieved_at: "2026-11-13T00:00:00Z"}
  - id: cplp
    kind: membership
    label: CPLP
    short: "Comunidade dos Países de Língua Portuguesa."
    body: >-
      Criada em 1996 por países que têm o português como língua oficial. Cuida da cooperação política, cultural e da difusão da língua portuguesa.
    icon: null
    sources:
      - {id: wp-pt-cplp, title: "Comunidade dos Países de Língua Portuguesa (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Comunidade_dos_Pa%C3%ADses_de_L%C3%ADngua_Portuguesa", license: "CC BY-SA 4.0", retrieved_at: "2026-11-13T00:00:00Z"}
  - id: ocde
    kind: membership
    label: OCDE
    short: "Organização para a Cooperação e Desenvolvimento Econômico."
    body: >-
      Fundada em 1961, reúne 38 países, a maioria de renda alta, que comparam políticas públicas e seguem padrões comuns (impostos, educação, governança). Publica estatísticas e estudos muito usados, como o PISA. O Brasil é parceiro-chave e candidato a membro.
    icon: null
    sources:
      - {id: wp-pt-ocde, title: "Organização para a Cooperação e Desenvolvimento Econômico (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Organiza%C3%A7%C3%A3o_para_a_Coopera%C3%A7%C3%A3o_e_Desenvolvimento_Econ%C3%B4mico", license: "CC BY-SA 4.0", retrieved_at: "2026-11-13T00:00:00Z"}

  # --- economia (kind other: o contrato não tem um kind próprio; o web agrupa "other" em "Economia e indicadores") ----
  # Textos próprios escritos por agente em 2026-11-15 (RASCUNHO, revisão humana pendente). Títulos da Wikipédia verificados
  # na API da Wikipédia em 2026-11-15; a página do indicador do Banco Mundial é a definição do dado que o Atlas mostra.
  - id: pib
    kind: other
    label: PIB (Produto Interno Bruto)
    short: Valor de tudo o que um país produz em bens e serviços finais em um ano.
    body: >-
      Soma o valor dos bens e serviços finais produzidos dentro do país num período, em geral um ano. Mede o tamanho
      da economia, não o bem-estar: um país muito populoso pode ter PIB alto e renda por pessoa baixa. No Atlas o PIB
      aparece em dólares correntes (Banco Mundial), então também sobe e desce com o câmbio.
    icon: null
    sources:
      - {id: wp-pt-pib, title: "Produto interno bruto (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Produto_interno_bruto", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}
      - {id: wb-ny-gdp-mktp-cd, title: "Indicador NY.GDP.MKTP.CD (Banco Mundial)", url: "https://data.worldbank.org/indicator/NY.GDP.MKTP.CD", license: "CC BY 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: pib-per-capita
    kind: other
    label: PIB per capita
    short: PIB dividido pela população, ou seja, quanto a economia produz em média por habitante.
    body: >-
      É a medida mais usada para comparar a renda média entre países. Por ser uma média, esconde a desigualdade: o
      índice de Gini ajuda a ver como a renda se divide. No Atlas ele vem em paridade do poder de compra (PPC), que
      corrige as diferenças de preço entre os países.
    icon: null
    sources:
      - {id: wp-pt-pib-per-capita, title: "Produto interno bruto: PIB per capita (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Produto_interno_bruto#PIB_per_capita", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}
      - {id: wb-ny-gdp-pcap-pp-cd, title: "Indicador NY.GDP.PCAP.PP.CD (Banco Mundial)", url: "https://data.worldbank.org/indicator/NY.GDP.PCAP.PP.CD", license: "CC BY 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: paridade-do-poder-de-compra
    kind: other
    label: Paridade do poder de compra (PPC)
    short: Forma de converter moedas que considera o que o dinheiro compra em cada país, e não só o câmbio.
    body: >-
      Um dólar trocado no câmbio compra mais coisas em alguns países do que em outros. A PPC usa os preços de uma
      cesta de produtos para criar o "dólar internacional", que compra o mesmo em qualquer lugar; assim dá para
      comparar rendas de países com custo de vida diferente. O fator de conversão (moeda local por dólar
      internacional), comparado ao câmbio de mercado, indica se a moeda está barata ou cara.
    icon: null
    sources:
      - {id: wp-pt-ppc, title: "Paridade do poder de compra (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Paridade_do_poder_de_compra", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}
      - {id: wb-pa-nus-ppp, title: "Indicador PA.NUS.PPP (Banco Mundial)", url: "https://data.worldbank.org/indicator/PA.NUS.PPP", license: "CC BY 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: crescimento-do-pib
    kind: other
    label: Crescimento do PIB
    short: Quanto o PIB aumentou em relação ao ano anterior, já descontada a inflação.
    body: >-
      É calculado com preços constantes (o chamado PIB real), para que a alta de preços não pareça crescimento.
      Valores negativos indicam que a economia encolheu. Países pobres podem crescer rápido partindo de uma base
      baixa; países ricos costumam crescer devagar.
    icon: null
    sources:
      - {id: wp-pt-crescimento-economico, title: "Crescimento econômico (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Crescimento_econ%C3%B4mico", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}
      - {id: wb-ny-gdp-mktp-kd-zg, title: "Indicador NY.GDP.MKTP.KD.ZG (Banco Mundial)", url: "https://data.worldbank.org/indicator/NY.GDP.MKTP.KD.ZG", license: "CC BY 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: inflacao
    kind: other
    label: Inflação
    short: Aumento geral dos preços ao longo do tempo, que reduz o que o dinheiro consegue comprar.
    body: >-
      Costuma ser medida por um índice de preços ao consumidor, que acompanha o custo de uma cesta de produtos e
      serviços (no Brasil, o IPCA). Inflação baixa e estável é a meta da maioria dos bancos centrais; inflação muito
      alta corrói salários e poupança. Quando os preços caem, fala-se em deflação.
    icon: null
    sources:
      - {id: wp-pt-inflacao, title: "Inflação (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Infla%C3%A7%C3%A3o", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}
      - {id: wb-fp-cpi-totl-zg, title: "Indicador FP.CPI.TOTL.ZG (Banco Mundial)", url: "https://data.worldbank.org/indicator/FP.CPI.TOTL.ZG", license: "CC BY 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: desemprego
    kind: other
    label: Taxa de desemprego
    short: Parte das pessoas que querem trabalhar e procuram emprego, mas não encontram.
    body: >-
      A conta é feita sobre a força de trabalho (quem trabalha ou procura trabalho), não sobre a população toda:
      estudantes e aposentados que não procuram emprego ficam de fora, e quem desiste de procurar deixa de contar
      como desempregado. O Atlas usa a estimativa da OIT, feita para ser comparável entre países.
    icon: null
    sources:
      - {id: wp-pt-desemprego, title: "Desemprego (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Desemprego", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}
      - {id: wb-sl-uem-totl-zs, title: "Indicador SL.UEM.TOTL.ZS (Banco Mundial)", url: "https://data.worldbank.org/indicator/SL.UEM.TOTL.ZS", license: "CC BY 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: divida-publica
    kind: other
    label: Dívida pública
    short: O que o governo deve, em geral mostrado como parte do PIB.
    body: >-
      Soma empréstimos e títulos que o governo emite para cobrir gastos maiores que a arrecadação. Dividir pelo PIB
      mostra o peso da dívida em relação ao tamanho da economia. Não existe um limite que sirva para todos: o risco
      depende também dos juros, da moeda em que a dívida está e de quem a detém. O Atlas mostra a dívida do governo
      central, que alguns países não informam.
    icon: null
    sources:
      - {id: wp-pt-divida-governamental, title: "Dívida governamental (Wikipédia)", url: "https://pt.wikipedia.org/wiki/D%C3%ADvida_governamental", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}
      - {id: wb-gc-dod-totl-gd-zs, title: "Indicador GC.DOD.TOTL.GD.ZS (Banco Mundial)", url: "https://data.worldbank.org/indicator/GC.DOD.TOTL.GD.ZS", license: "CC BY 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: conta-corrente
    kind: other
    label: Conta corrente
    short: Saldo das trocas de um país com o exterior em bens, serviços, rendas e transferências.
    body: >-
      É uma parte da balança de pagamentos. Positiva: o país recebe do exterior mais do que paga, por exemplo
      porque exporta muito. Negativa: gasta mais fora do que recebe e precisa se financiar com investimento ou
      empréstimos estrangeiros. Um déficit não é ruim por si só, mas déficits grandes e longos deixam o país mais
      vulnerável.
    icon: null
    sources:
      - {id: wp-pt-balanca-de-pagamentos, title: "Balança de pagamentos (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Balan%C3%A7a_de_pagamentos", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}
      - {id: wb-bn-cab-xoka-gd-zs, title: "Indicador BN.CAB.XOKA.GD.ZS (Banco Mundial)", url: "https://data.worldbank.org/indicator/BN.CAB.XOKA.GD.ZS", license: "CC BY 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: reservas-internacionais
    kind: other
    label: Reservas internacionais
    short: Dinheiro em moeda estrangeira e ouro guardado pelo banco central.
    body: >-
      Servem para pagar compromissos com o exterior e para defender a moeda em crises, por exemplo vendendo dólares
      quando o câmbio dispara. Costumam ser comparadas com as importações (quantos meses elas pagariam) ou com a
      dívida externa de curto prazo.
    icon: null
    sources:
      - {id: wp-pt-reserva-internacional, title: "Reserva internacional (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Reserva_internacional", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}
      - {id: wb-fi-res-totl-cd, title: "Indicador FI.RES.TOTL.CD (Banco Mundial)", url: "https://data.worldbank.org/indicator/FI.RES.TOTL.CD", license: "CC BY 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: indice-de-gini
    kind: other
    label: Índice de Gini
    short: Mede a desigualdade de renda, de 0 (todos ganham igual) a 100 (uma pessoa fica com tudo).
    body: >-
      É calculado a partir da distribuição da renda (ou do consumo) das famílias. Os países menos desiguais ficam
      perto de 25 a 30; os mais desiguais passam de 50. As pesquisas são feitas em anos diferentes em cada país,
      então confira o ano do dado antes de comparar.
    icon: null
    sources:
      - {id: wp-pt-coeficiente-de-gini, title: "Coeficiente de Gini (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Coeficiente_de_Gini", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}
      - {id: wb-si-pov-gini, title: "Indicador SI.POV.GINI (Banco Mundial)", url: "https://data.worldbank.org/indicator/SI.POV.GINI", license: "CC BY 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: pobreza-extrema
    kind: other
    label: Pobreza extrema
    short: Viver com menos de US$ 3,00 por dia, a linha internacional do Banco Mundial (preços de 2021).
    body: >-
      A linha é medida em dólares de paridade do poder de compra, então leva em conta o custo de vida de cada país.
      Ela já foi atualizada algumas vezes (US$ 1,90 e depois US$ 2,15) conforme chegaram novos dados de preços, por
      isso números antigos podem ter usado outra linha.
    icon: null
    sources:
      - {id: wp-pt-pobreza-absoluta, title: "Pobreza absoluta (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Pobreza_absoluta", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}
      - {id: wb-si-pov-dday, title: "Indicador SI.POV.DDAY (Banco Mundial)", url: "https://data.worldbank.org/indicator/SI.POV.DDAY", license: "CC BY 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: idh
    kind: other
    label: IDH (Índice de Desenvolvimento Humano)
    short: Índice da ONU, de 0 a 1, que combina saúde, educação e renda.
    body: >-
      Criado pelo PNUD em 1990 para medir desenvolvimento além do PIB. Junta expectativa de vida, anos de estudo
      (a média dos adultos e o esperado para as crianças) e renda por pessoa. Acima de 0,8 é considerado muito alto.
      Não mede desigualdade nem impacto ambiental.
    icon: null
    sources:
      - {id: wp-pt-idh, title: "Índice de Desenvolvimento Humano (Wikipédia)", url: "https://pt.wikipedia.org/wiki/%C3%8Dndice_de_Desenvolvimento_Humano", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}
      - {id: undp-hdi, title: "Human Development Index (PNUD)", url: "https://hdr.undp.org/data-center/human-development-index", license: "CC BY 3.0 IGO", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: taxa-de-cambio
    kind: currency
    label: Taxa de câmbio
    short: Preço de uma moeda em outra, como quantos reais custa um dólar.
    body: >-
      Pode ser flutuante (definida pelo mercado), fixa (o governo garante um valor) ou algo entre os dois. Quando a
      moeda perde valor, as importações ficam mais caras e as exportações mais baratas para quem compra de fora.
      Nas páginas de moeda, o Atlas usa principalmente as taxas de referência do Banco Central Europeu.
    icon: null
    sources:
      - {id: wp-pt-taxa-de-cambio, title: "Taxa de câmbio (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Taxa_de_c%C3%A2mbio", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  # --- sistemas de governo ---------------------------------------------------------------------
  - id: federacao
    kind: system
    label: Federação
    short: País formado por estados ou províncias com governo próprio e autonomia garantida pela Constituição.
    body: >-
      O poder é dividido entre o governo central e as unidades (estados, províncias, cantões), e o centro não pode
      simplesmente acabar com essa autonomia. Cada unidade costuma ter seu próprio legislativo e executivo. Brasil,
      Estados Unidos, Alemanha e Índia são federações.
    icon: null
    sources:
      - {id: wp-pt-federacao, title: "Federação (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Federa%C3%A7%C3%A3o", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: estado-unitario
    kind: system
    label: Estado unitário
    short: País em que o governo central concentra o poder e as regiões têm só a autonomia que ele delega.
    body: >-
      Pode haver regiões e municípios com governo próprio, mas essa autonomia vem de lei nacional e pode ser mudada
      pelo centro. É o modelo da maioria dos países, como França, Japão e Portugal.
    icon: null
    sources:
      - {id: wp-pt-estado-unitario, title: "Estado unitário (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Estado_unit%C3%A1rio", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: separacao-de-poderes
    kind: system
    label: Separação de poderes
    short: Divisão do Estado em Executivo, Legislativo e Judiciário, para que um poder limite o outro.
    body: >-
      A ideia, associada a Montesquieu, é impedir que uma só pessoa ou órgão faça as leis, as execute e julgue quem
      as descumpre. Cada poder tem funções próprias e meios de fiscalizar os outros, os chamados freios e
      contrapesos.
    icon: null
    sources:
      - {id: wp-pt-separacao-de-poderes, title: "Separação de poderes (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Separa%C3%A7%C3%A3o_de_poderes", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}

  - id: sufragio-universal
    kind: system
    label: Sufrágio universal
    short: Direito de voto para todos os adultos, sem exigência de renda, sexo, raça ou instrução.
    body: >-
      Foi conquistado aos poucos: em muitos países o voto foi primeiro só de homens com propriedade, depois de todos
      os homens e só mais tarde das mulheres. No Brasil, as mulheres votam desde 1932 e os analfabetos desde 1985.
    icon: null
    sources:
      - {id: wp-pt-sufragio-universal, title: "Sufrágio universal (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Sufr%C3%A1gio_universal", license: "CC BY-SA 4.0", retrieved_at: "2026-11-15T00:00:00Z"}
