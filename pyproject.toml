[project]
name = "atlas-api"
version = "0.1.0"
description = "Read-only API for modern countries, historical polities and timelines"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pyyaml>=6",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-pyyaml"]
# Never imported by the API process (src/atlas_api). Only used by etl/.
etl = ["pandas", "geopandas", "shapely", "httpx", "pyproj"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.fastapi]
entrypoint = "atlas_api.main:app"
