services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "${ATLAS_DB_PORT:-5432}:5432"  # ATLAS_DB_PORT in .env when 5432 is taken by another project
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
